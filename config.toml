# Build configuration for https://lavkastudios.com/app-ads.txt
#
# Output order:
#   ownerdomain
#   [[accounts]] blocks (each line is required; a missing line blocks publishing)
#   reseller groups (deduplicated, sorted; a line appears only in the first group that has it)
#
# Source kinds:
#   file - maintained by hand or by the weekly update task
#   url  - downloaded by scripts/fetch.py; a bad download keeps the previous version

owner_domain = "lavkastudios.com"
live_url = "https://lavkastudios.com/app-ads.txt"
output = "dist/app-ads.txt"
allow_variables = []
max_drop_ratio = 0.25        # stop if the record count drops by more than 25% vs live
max_growth_ratio = 2.5       # stop if it grows more than 2.5x
max_bytes = 1_000_000
min_total_records = 3000

reseller_groups = [
  { id = "main",       title = "Resellers" },
  { id = "additional", title = "Additional resellers" },
]

[[accounts]]
title = "Direct accounts"
path = "sources/accounts/direct.txt"

[[accounts]]
title = "Additional direct accounts"
path = "sources/accounts/additional.txt"


